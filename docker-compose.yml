# Local demo: docker compose up --build
# Open http://localhost:8080  (frontend + API via nginx)
# API docs via nginx: http://localhost:8080/docs
#
# Outbound FR24 requests use your Mac/home public IP (not a datacenter IP),
# so no paid residential proxy is needed for local demos.

services:
  api:
    build: .
    expose:
      - "8000"
    environment:
      SCAN_TIMEOUT_SECONDS: "45"
      SCAN_CACHE_TTL_SECONDS: "300"
      SCAN_RATE_LIMIT_PER_MINUTE: "10"

  web:
    image: nginx:1.27-alpine
    depends_on:
      - api
    ports:
      - "8080:80"
    volumes:
      - ./web:/usr/share/nginx/html:ro
      - ./web/config.docker.js:/usr/share/nginx/html/config.js:ro
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
